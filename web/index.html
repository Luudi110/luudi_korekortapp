<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kørekort</title>
    <link rel="stylesheet" href="./style.css" />
</head>
<body>
    <div id="app">
        <header class="topbar">
            <div class="brand">
                <svg viewBox="0 0 24 24" class="brand-icon"><path fill="currentColor" d="M3 17h18v2H3zM4 15l2-8 4 4 2-6 2 6 4-4 2 8z"/></svg>
                <span>KØREKORT</span>
            </div>
            <button class="icon-btn" id="settingsBtn" aria-label="Mere">
                <svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="2" fill="currentColor"/><circle cx="12" cy="12" r="2" fill="currentColor"/><circle cx="19" cy="12" r="2" fill="currentColor"/></svg>
            </button>
        </header>

        <main id="content">
            <!-- Kørekort -->
            <section class="view active" id="view-card">
                <div id="myCard"></div>
                <div class="actions" id="actions">
                    <button class="btn primary" id="sendNearestBtn">Send bevis til nærmeste politi</button>
                    <button class="btn outline" id="airshareBtn">AirShare kort til politi</button>
                    <p class="status" id="statusLine"></p>
                </div>
            </section>

            <!-- Kortinfo -->
            <section class="view" id="view-info"></section>

            <!-- Modtaget (kun politi) -->
            <section class="view" id="view-received"></section>
        </main>

        <nav class="tabbar" id="tabbar">
            <button class="tab active" data-view="card">
                <span class="tab-icon"><svg viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="1.5" fill="currentColor"/><rect x="5" y="9" width="5" height="1.6" fill="#0b1a35"/><rect x="5" y="12.4" width="7" height="1.6" fill="#0b1a35"/></svg></span>
                <span>Kørekort</span>
            </button>
            <button class="tab hidden" data-view="received" id="receivedTab">
                <span class="tab-icon"><svg viewBox="0 0 24 24"><path d="M3.5 13.5 6 5h12l2.5 8.5V19a1 1 0 0 1-1 1h-15a1 1 0 0 1-1-1z M3.5 13.5H9l1 2h4l1-2h5.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg><i class="badge hidden" id="receivedBadge"></i></span>
                <span>Modtaget</span>
            </button>
            <button class="tab" data-view="info">
                <span class="tab-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9.2" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="7.8" r="1.2" fill="currentColor"/><path d="M10.6 10.6h2v6.2h1.2v1.4h-4.4v-1.4h1.2v-4.8h-0z" fill="currentColor"/></svg></span>
                <span>Kortinfo</span>
            </button>
        </nav>

        <!-- Ark (AirShare liste / indstillinger) -->
        <div class="sheet-backdrop" id="sheetBackdrop"></div>
        <div class="sheet" id="sheet">
            <div class="sheet-handle"></div>
            <div id="sheetContent"></div>
        </div>
    </div>

    <script src="./app.js"></script>
</body>
</html>
